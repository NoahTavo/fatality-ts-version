<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dynedoc Fatality</title>
    <link rel="icon" href="assets/etoile.png">

    <!-- Police style jeu de combat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Roboto+Condensed:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="js/config/constants.js"></script>
    <script src="js/Weapon.js"></script>
    <script src="js/config/Weapons.js"></script>
    <script src="js/Player.js"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --blue: #0877c9;
            --blue-light: #39b5ff;
            --orange: #fb5607;
            --red: #d91e18;
            --yellow: #ffc400;
            --dark: #020609;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;

            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),url("assets/etoile.png");
            background-repeat: no-repeat; /* Empêche la répétition de l'image */
            background-position: center;
            background-size: cover;
            backdrop-filter: blur(5px);

            color: white;

            font-family: "Roboto Condensed", sans-serif;
        }


        /* ========================================
           ECRAN PRINCIPAL
        ======================================== */

        .fatality-screen {
            position: relative;

            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 25px;

            background:
                    linear-gradient(
                            rgba(0, 0, 0, .15),
                            rgba(0, 0, 0, .7)
                    );
        }


        /* ========================================
           TEXTURE / GRILLE
        ======================================== */

        .fatality-screen::before {
            content: "";

            position: absolute;
            inset: 0;

            pointer-events: none;

            background-image:
                    linear-gradient(
                            rgba(255,255,255,.025) 1px,
                            transparent 1px
                    ),
                    linear-gradient(
                            90deg,
                            rgba(255,255,255,.025) 1px,
                            transparent 1px
                    );

            background-size: 40px 40px;

            opacity: .5;
        }


        /* ========================================
           LUEUR CENTRALE
        ======================================== */

        .fatality-screen::after {
            content: "";

            position: absolute;

            width: 700px;
            height: 400px;

            top: 20%;

            background:
                    radial-gradient(
                            ellipse,
                            rgba(8,119,201,.25),
                            transparent 70%
                    );

            filter: blur(25px);

            pointer-events: none;
        }


        /* ========================================
           LOGO
        ======================================== */

        .logo {
            position: relative;
            z-index: 5;

            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;

            user-select: none;
        }

        .logo-small {
            font-family: "Roboto Condensed", sans-serif;

            font-size: 13px;
            font-weight: 900;

            letter-spacing: 7px;

            color: #9fdcff;

            text-transform: uppercase;

            margin-bottom: 4px;

            text-shadow:
                    0 0 10px rgba(57,181,255,.7);
        }


        .logo h1 {
            position: relative;

            font-family: "Cinzel Decorative", serif;

            font-weight: 900;

            font-size: clamp(48px, 8vw, 100px);

            line-height: .85;

            letter-spacing: -3px;

            text-transform: uppercase;

            transform: scaleY(1.05);

            background:
                    linear-gradient(
                            to bottom,
                            #fff8bd 0%,
                            #ffd21c 28%,
                            #fb5607 60%,
                            #a90000 100%
                    );

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;

            filter:
                    drop-shadow(3px 4px 0 #180000)
                    drop-shadow(0 0 8px rgba(251,86,7,.7));

            -webkit-text-stroke: 1px #ffb000;
        }


        /* trait sous le logo */

        .logo-line {
            width: 380px;
            max-width: 80vw;

            height: 4px;

            margin: 14px auto 0;

            background:
                    linear-gradient(
                            90deg,
                            transparent,
                            var(--blue),
                            var(--blue-light),
                            var(--orange),
                            transparent
                    );

            box-shadow:
                    0 0 10px rgba(8,119,201,.7);
        }


        .logo-subtitle {
            margin-top: 7px;

            font-family: monospace;

            font-size: 10px;

            letter-spacing: 5px;

            color: #7e9caf;

            text-transform: uppercase;
        }


        /* ========================================
           ZONE MENU
        ======================================== */

        .menu-wrapper {
            position: relative;
            z-index: 5;

            width: 340px;
            max-width: 90vw;

            padding: 10px 0;

            margin: 0;

            text-align: center;
        }


        /* ========================================
           MENU
        ======================================== */

        .menu {
            list-style: none;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 3px;
        }


        .menu-item {
            position: relative;

            width: 290px;
            max-width: 85vw;

            height: 38px;

            display: flex;

            align-items: center;
            justify-content: center;

            font-family:
                    "Roboto Condensed",
                    sans-serif;

            font-size: 20px;

            font-weight: 900;

            letter-spacing: 4px;

            color: #f4f4f4;

            text-transform: uppercase;

            background:
                    linear-gradient(
                            90deg,
                            transparent,
                            rgba(8,119,201,.25),
                            rgba(8,119,201,.45),
                            rgba(8,119,201,.25),
                            transparent
                    );

            border-top: 1px solid rgba(255,255,255,.15);
            border-bottom: 1px solid rgba(0,0,0,.7);

            text-shadow:
                    2px 2px 0 #000,
                    0 0 5px rgba(255,255,255,.3);

            cursor: pointer;

            transition: .15s;
        }


        /* ========================================
           OPTION SELECTIONNEE
        ======================================== */

        .menu-item.active {
            color: white;

            background:
                    linear-gradient(
                            90deg,
                            #351000,
                            #8f2700,
                            #351000
                    );

            border: 3px solid var(--orange);

            box-shadow:
                    0 0 0 1px #230000,
                    0 0 15px rgba(251,86,7,.55),
                    inset 0 0 15px rgba(251,86,7,.3);

            height: 42px;

            transform: scale(1.04);
        }


        .menu-item.active::before {
            content: "▶";

            position: absolute;

            left: 12px;

            color: var(--orange);

            font-size: 13px;

            text-shadow:
                    0 0 8px var(--orange);
        }


        .menu-item.active::after {
            content: "◀";

            position: absolute;

            right: 12px;

            color: var(--orange);

            font-size: 13px;

            text-shadow:
                    0 0 8px var(--orange);
        }


        .menu-item:hover {
            color: var(--orange);

            background:
                    linear-gradient(
                            90deg,
                            transparent,
                            rgba(251,86,7,.3),
                            transparent
                    );
        }


        /* ========================================
           INDICATIONS BAS DE L'ECRAN
        ======================================== */

        .controls {
            position: absolute;

            z-index: 5;

            bottom: 38px;

            left: 0;
            right: 0;

            display: flex;

            justify-content: space-between;

            align-items: flex-end;

            padding: 0 35px;

            pointer-events: none;
        }


        .control {
            font-family: "Roboto Condensed", sans-serif;

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 2px;

            color: #d7e4eb;

            text-transform: uppercase;

            line-height: 1.5;

            text-shadow:
                    2px 2px #000;
        }


        .control strong {
            color: var(--orange);

            font-size: 12px;
        }


        .control.right {
            text-align: right;
        }


        /* ========================================
           FOOTER
        ======================================== */

        .footer {
            position: absolute;

            z-index: 5;

            bottom: 10px;

            font-family: monospace;

            font-size: 8px;

            letter-spacing: 4px;

            color: #496373;

            text-transform: uppercase;
        }


        /* ========================================
           DECORATIONS
        ======================================== */

        .corner {
            position: absolute;

            width: 70px;
            height: 70px;

            opacity: .7;

            z-index: 4;
        }


        .corner::before,
        .corner::after {
            content: "";

            position: absolute;

            background: var(--blue-light);
        }


        .corner::before {
            width: 70px;
            height: 1px;
        }


        .corner::after {
            width: 1px;
            height: 70px;
        }


        .corner.top-left {
            top: 25px;
            left: 25px;
        }


        .corner.top-right {
            top: 25px;
            right: 25px;

            transform: rotate(90deg);
        }


        .corner.bottom-left {
            bottom: 25px;
            left: 25px;

            transform: rotate(-90deg);
        }


        .corner.bottom-right {
            bottom: 25px;
            right: 25px;

            transform: rotate(180deg);
        }
        /* ========================================
   SELECTEURS PERSONNAGES
======================================== */

        .character-selectors {
            position: absolute;
            z-index: 6;
            top: 50%;
            left: 0;
            right: 0;
            transform: translateY(-50%);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 35px;
            pointer-events: none;
        }

        .character-selector {
            width: 190px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
        }

        .character-selector label {
            font-family: "Roboto Condensed", sans-serif;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 3px;
            color: #9fdcff;
            text-transform: uppercase;
            text-shadow: 2px 2px #000, 0 0 8px rgba(57,181,255,.5);
        }

        .character-selector select {
            width: 100%;
            height: 38px;
            padding: 0 12px;
            border: 2px solid var(--orange);
            outline: none;
            border-radius: 0;
            background:
                    linear-gradient(90deg, #351000, #8f2700, #351000);
            color: white;
            font-family: "Roboto Condensed", sans-serif;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow:
                    0 0 0 1px #230000,
                    0 0 15px rgba(251,86,7,.35),
                    inset 0 0 12px rgba(251,86,7,.25);
        }

        .character-selector select:focus {
            box-shadow:
                    0 0 0 1px #230000,
                    0 0 20px rgba(251,86,7,.65),
                    inset 0 0 12px rgba(251,86,7,.3);
        }

        .character-preview {
            width: 110px;
            height: 110px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(57,181,255,.5));
        }

        .character-selector select option {
            background: #020609;
            color: white;
        }


        /* ========================================
           RESPONSIVE
        ======================================== */

        @media (max-width: 600px) {

            .logo {
                margin-top: 25px;
            }

            .logo h1 {
                font-size: 48px;
            }

            .logo-small {
                font-size: 10px;
                letter-spacing: 4px;
            }

            .menu-wrapper {
                margin-top: 20px;
            }

            .menu-item {
                width: 260px;
                height: 35px;

                font-size: 17px;
            }

            .menu-item.active {
                height: 39px;
            }

            .controls {
                padding: 0 15px;
                bottom: 32px;
            }

            .control {
                font-size: 8px;
                letter-spacing: 1px;
            }

            .corner {
                display: none;
            }
            .character-selectors {
                top: 8%;
                padding: 0 10px;
            }

            .character-selector {
                width: 125px;
            }

            .character-preview {
                display: none;
            }

            .character-selector label {
                font-size: 9px;
                letter-spacing: 2px;
            }

            .character-selector select {
                height: 32px;
                font-size: 11px;
                letter-spacing: 1px;
            }
        }




        @media (max-width: 900px) {
            .character-selectors {
                top: 18%;
                transform: none;
                padding: 0 20px;
            }

            .character-selector {
                width: 150px;
            }

            .character-preview {
                width: 75px;
                height: 75px;
            }

            .character-selector select {
                font-size: 13px;
            }
        }


    </style>
</head>


<body>

<main class="fatality-screen">


    <!-- ==================================
         DECORATIONS
    ================================== -->

    <div class="corner top-left"></div>
    <div class="corner top-right"></div>

    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>


    <!-- ==================================
         LOGO
    ================================== -->

    <header class="logo">

        <div class="logo-small">
            DYNEDOC • MARSEILLE
        </div>

        <h1>
            DYNEDOC<br>
            FATALITY
        </h1>

        <div class="logo-line"></div>

        <div class="logo-subtitle">
            1V1 COMBAT
        </div>

    </header>

    <!-- ==================================
         SELECTEURS PERSONNAGES
    ================================== -->

    <div class="character-selectors">

        <!-- JOUEUR 1 : à gauche du titre -->
        <div class="character-selector">
            <label for="player1">JOUEUR 1</label>
            <img id="player1-preview" class="character-preview" src="assets/characters/Jules.png" alt="Jules">
            <select id="player1">
            </select>
        </div>

        <!-- JOUEUR 2 : à droite du titre -->
        <div class="character-selector">
            <label for="player2">JOUEUR 2</label>
            <img id="player2-preview" class="character-preview" src="assets/characters/Jules.png" alt="Jules">
            <select id="player2">
            </select>
        </div>

    </div>


    <!-- ==================================
         MENU PRINCIPAL
    ================================== -->

    <section class="menu-wrapper">

        <nav>

            <ul class="menu">

                <li>
                    <button
                            class="menu-item active"
                            onclick="startGame()"
                    >
                        JOUER
                    </button>
                </li>




            </ul>

        </nav>

    </section>


    <!-- ==================================
         CONTROLES
    ================================== -->

    <div class="controls">
        <div class="control right">
            <strong>ENTER</strong><br>
            POUR SÉLECTIONNER
        </div>

    </div>


    <!-- ==================================
         FOOTER
    ================================== -->

    <div class="footer">
        FIGHT • DYNEDOC MARSEILLE • 2026
    </div>

</main>


</body>

</html>
